name: Mac app

# Builds the native Mac app and runs its checks on a real Mac (the renderer
# and the window need one).
on:
  push:
    paths:
      - 'mac/**'
      - 'windows/IdMaker.Core/**'
      - 'windows/IdMaker.Vision/**'
      - 'assets/**'
      - 'test/golden-front.png'
      - '.github/workflows/mac.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # The Mac workload is tied to one Xcode. mac/workloads.json pins the
      # one that builds with the Xcode the runner has; move both together.
      MAC_XCODE: '/Applications/Xcode_26.6.app'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx
      - name: Workload and Xcode
        run: |
          sudo xcode-select -s "$MAC_XCODE"
          dotnet --version
          dotnet workload install macos --from-rollback-file mac/workloads.json
          dotnet workload list
      - name: Core tests, on a Mac
        run: dotnet test windows/IdMaker.Tests -c Release
      - name: Build
        run: dotnet build mac/IdMaker.Mac -c Release
      - name: Self-test
        run: |
          app=$(find mac/IdMaker.Mac/bin/Release -maxdepth 4 -name '*.app' | head -1)
          echo "$app"; ls "$app/Contents/MacOS"
          "$app/Contents/MacOS/AlphaPremierIdMaker" --selftest
