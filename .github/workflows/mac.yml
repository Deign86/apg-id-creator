name: Mac app

# Builds the native Mac app and runs its checks on a real Mac (the renderer
# and the window need one).
on:
  push:
    paths:
      - 'mac/**'
      - 'windows/IdMaker.Core/**'
      - 'windows/IdMaker.Vision/**'
      - 'windows/IdMaker.Tests/FakeFirebase.cs'
      - 'windows/IdMaker.App/Fonts/**'
      - 'assets/**'
      - 'test/golden-front.png'
      - '.github/workflows/mac.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # The Mac workload is tied to one Xcode. mac/workloads.json pins the
      # one that builds with the Xcode the runner has; move both together.
      MAC_XCODE: '/Applications/Xcode_26.6.app'
    # Every dotnet command runs in mac/, where global.json keeps the SDK on
    # the 10.0.4xx band the pinned workload belongs to, whatever newer SDK
    # the runner also has.
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx
      - name: Workload and Xcode
        run: |
          sudo xcode-select -s "$MAC_XCODE"
          dotnet --version
          dotnet workload install macos --from-rollback-file workloads.json
          dotnet workload list
      - name: Core tests, on a Mac
        run: dotnet test ../windows/IdMaker.Tests -c Release
      - name: Build, as it is released
        run: dotnet build IdMaker.Mac -c Release
      - name: Build, with the window tests in it
        run: dotnet build IdMaker.Mac -c Release -p:WindowTest=true
      - name: Self-test
        env:
          IDMAKER_REPORT_DIR: ${{ github.workspace }}/report
        run: |
          app=$(find IdMaker.Mac/bin/Release -maxdepth 4 -name '*.app' | head -1)
          echo "$app"; ls "$app/Contents/MacOS" "$app/Contents/Resources"
          "$app/Contents/MacOS/AlphaPremierIdMaker" --selftest --repo "$GITHUB_WORKSPACE"
      - name: Window tests
        env:
          IDMAKER_REPORT_DIR: ${{ github.workspace }}/report
        run: |
          app=$(find IdMaker.Mac/bin/Release -maxdepth 4 -name '*.app' | head -1)
          "$app/Contents/MacOS/AlphaPremierIdMaker" --windowtest --repo "$GITHUB_WORKSPACE"
      # The pictures the window tests took, small, in the log itself: the
      # log can be read from anywhere, the artifact only by a signed-in person.
      - name: Show the window
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          for name in 3-check 4-saved 7-refused; do
            [ -f "report/$name.png" ] || continue
            sips -Z 1000 -s format jpeg -s formatOptions 55 "report/$name.png" --out "report/$name.jpg" >/dev/null
            echo "=====BEGIN $name====="
            base64 -i "report/$name.jpg" | fold -w 200
            echo "=====END $name====="
          done
      # shortcut: finds the pen tablet driver's file and its checksum once, so they can be pinned (GATES.md, M7); replaced by the pinned check when they are.
      - name: Pen tablet driver, as XP-Pen serves it
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          url='https://download01.xp-pen.com/file/2026/10/XPPenMac_4.0.21_261026.zip'
          curl -sSL --fail -o driver.zip "$url" || { echo "not at $url"; exit 0; }
          shasum -a 256 driver.zip; ls -l driver.zip
          unzip -o -q driver.zip -d driver && find driver -maxdepth 3 | head -40
          dmg=$(find driver -name '*.dmg' | head -1)
          [ -n "$dmg" ] && shasum -a 256 "$dmg" && hdiutil attach -nobrowse -readonly "$dmg" | tail -3 && ls -la /Volumes/*/ | head -40
      - name: Keep the card it drew
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-report
          path: report
          if-no-files-found: ignore
