name: Windows app

# Builds the native app, runs every test on a real Windows machine (the
# renderer and the window need one), and packages an installer.
on:
  push:
    paths:
      - 'windows/**'
      - 'assets/**'
      - 'test/golden-front.png'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      IDMAKER_REPORT_DIR: ${{ github.workspace }}\report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build windows/IdMaker.sln -c Release
      - name: Core tests
        run: dotnet test windows/IdMaker.Tests -c Release --no-build
      - name: Renderer and window tests
        run: dotnet test windows/IdMaker.App.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: How the native card compares with the web app's
        if: always()
        shell: pwsh
        run: |
          foreach ($f in 'front-against-web.txt', 'font-metrics.txt') {
            $p = Join-Path $env:IDMAKER_REPORT_DIR $f
            if (Test-Path $p) { "--- $f"; Get-Content $p | Select-Object -First 60 } else { "--- $f was not written" }
          }
      - name: Keep the rendered card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-report
          path: report
          if-no-files-found: ignore

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Package the installer
        shell: pwsh
        run: ./windows/installer/package.ps1
      - name: Check the installer installs and the app starts
        shell: pwsh
        run: ./windows/installer/selftest.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaPremierIdMaker-setup
          path: windows/dist/AlphaPremierIdMaker-setup.zip
          if-no-files-found: error
