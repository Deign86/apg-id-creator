[package]
name = "apg-id-maker"
version = "1.17.0"
description = "Alpha Premier ID Maker"
authors = ["Alpha Premier Group of Companies"]
edition = "2021"
# Tauri 2.12 itself needs 1.90. Saying so here makes cargo complain
# about the toolchain rather than about a dependency nobody chose.
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools is a Cargo feature, not a setting: without it the web
# inspector is compiled out of release builds, and a problem on the
# issuing laptop becomes undiagnosable. The old C# shell left it on for
# the same reason.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
